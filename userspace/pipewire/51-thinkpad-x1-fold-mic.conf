# /etc/pipewire/pipewire.conf.d/51-thinkpad-x1-fold-mic.conf
# Mix the X1 Fold's 4 DMICs to mono with +18 dB (2.0 per channel x 4 correlated mics = x8)
# and offer it as the default "Built-in Microphones" source. The raw DMIC level is low
# (speech ~ -47 dBFS RMS at 0 dB DMIC Volume); Windows adds gain in its Fortemedia APO.
context.modules = [
  {
    name = libpipewire-module-filter-chain
    args = {
      node.description = "Built-in Microphones"
      media.name = "Built-in Microphones"
      filter.graph = {
        nodes = [
          {
            type = builtin
            name = mix
            label = mixer
            control = { "Gain 1" = 2.0 "Gain 2" = 2.0 "Gain 3" = 2.0 "Gain 4" = 2.0 }
          }
        ]
        inputs = [ "mix:In 1" "mix:In 2" "mix:In 3" "mix:In 4" ]
        outputs = [ "mix:Out" ]
      }
      capture.props = {
        node.name = "capture.thinkpad_fold_mic"
        audio.channels = 4
        audio.position = [ FL FR RL RR ]
        target.object = "thinkpad_fold_dmic_raw"
        stream.dont-remix = true
        node.passive = true
      }
      playback.props = {
        node.name = "thinkpad_fold_mic"
        media.class = Audio/Source
        audio.channels = 1
        audio.position = [ MONO ]
        priority.session = 2000
      }
    }
  }
]
