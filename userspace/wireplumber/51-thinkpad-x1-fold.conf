# /etc/wireplumber/wireplumber.conf.d/51-thinkpad-x1-fold.conf
# AVS on the ThinkPad X1 Fold Gen 1: give the raw 4-channel DMIC node a stable name (its
# platform index changes between boots) so the boosted mono source in
# pipewire/51-thinkpad-x1-fold-mic.conf can target it; hide the codec's input (no mics on the
# ALC287); name the speaker sink.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_input.platform-avs_dmic.*" } ]
    actions = {
      update-props = {
        node.name = "thinkpad_fold_dmic_raw"
        node.description = "Built-in Microphone Array (raw, 4 channels)"
        priority.session = 100
        # The 32-bit (24-in-32) DMIC topology/NHLT variant captures static; 16-bit works.
        audio.format = "S16LE"
        audio.rate = 48000
        audio.channels = 4
      }
    }
  }
  {
    matches = [ { node.name = "~alsa_input.platform-avs_hdaudio.*" } ]
    actions = { update-props = { node.disabled = true } }
  }
  {
    matches = [ { node.name = "~alsa_output.platform-avs_hdaudio.*" } ]
    actions = { update-props = { node.description = "Speakers" } }
  }
]
