# Lenovo ThinkPad X1 Fold Gen 1 (Lakefield HDA/DSP 8086:98c8): use the AVS driver.
# Needs the Lakefield SST base firmware from the machine's Windows driver
# as /usr/lib/firmware/intel/avs/lkf/dsp_basefw.bin (package x1fold-sst-firmware, or
# tools/extract-sst-firmware.sh into /usr/lib/firmware/updates/...).
# AVS must be the first driver to touch the controller in a boot; nothing else claims 98c8.
options snd_intel_dspcfg dsp_driver=4
