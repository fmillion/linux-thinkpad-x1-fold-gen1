# ThinkPad X1 Fold bring-up debug aid (optional): turn soft/hard lockups into a panic so the
# kernel log tail is saved to EFI pstore (/sys/fs/pstore/ after the next boot), then reboot.
# Remove once the platform is considered stable.
kernel.softlockup_panic = 1
kernel.hardlockup_panic = 1
kernel.panic = 10
