# /etc/sddm.conf.d/10-thinkpad-x1-fold-wayland.conf
# Run the SDDM greeter on Wayland (KWin). With i915 driving the X1 Fold's upside-down panel,
# the X11 greeter rotates the picture but not the hardware cursor; KWin handles both.
[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1
